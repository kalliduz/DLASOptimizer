<!DOCTYPE html>
<html>
<head>
    <title>Performance Test</title>
</head>
<body>
    <h1>DLAS Optimizer Performance Test</h1>
    <p>Open the browser console to see the performance test results.</p>
    <script>
        // Create a simple test image
        const canvas = document.createElement('canvas');
        canvas.width = 100;
        canvas.height = 100;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'red';
        ctx.fillRect(0, 0, 50, 50);
        ctx.fillStyle = 'blue';
        ctx.fillRect(50, 50, 50, 50);
        
        console.log('Performance test for DLAS optimizer optimizations');
        console.log('Testing array operations...');
        
        // Test 1: Array copying performance
        const testRects = [];
        for (let i = 0; i < 200; i++) {
            testRects.push({
                x: Math.random() * 100,
                y: Math.random() * 100,
                w: Math.random() * 20,
                h: Math.random() * 20,
                r: Math.floor(Math.random() * 256),
                g: Math.floor(Math.random() * 256),
                b: Math.floor(Math.random() * 256),
                a: Math.random(),
                angle: 0
            });
        }
        
        // Old method (using .map)
        console.time('Old method - .map()');
        for (let i = 0; i < 1000; i++) {
            const copy = testRects.map((r) => ({ ...r }));
        }
        console.timeEnd('Old method - .map()');
        
        // New method (pre-allocated array)
        console.time('New method - pre-allocated');
        for (let i = 0; i < 1000; i++) {
            const copy = new Array(testRects.length);
            for (let j = 0; j < testRects.length; j++) {
                copy[j] = { ...testRects[j] };
            }
        }
        console.timeEnd('New method - pre-allocated');
        
        // Test 2: Chart min/max calculation
        const chartData = [];
        for (let i = 0; i < 240; i++) {
            chartData.push({
                cur: Math.random() * 1000,
                best: Math.random() * 1000
            });
        }
        
        // Old method (flatMap + Math.min/max)
        console.time('Old chart method - flatMap');
        for (let i = 0; i < 1000; i++) {
            const vals = chartData.flatMap((x) => [x.cur, x.best]);
            const min = Math.min(...vals);
            const max = Math.max(...vals);
        }
        console.timeEnd('Old chart method - flatMap');
        
        // New method (cached min/max)
        console.time('New chart method - cached');
        let chartMin = Infinity;
        let chartMax = -Infinity;
        chartData.forEach(p => {
            chartMin = Math.min(chartMin, p.cur, p.best);
            chartMax = Math.max(chartMax, p.cur, p.best);
        });
        for (let i = 0; i < 1000; i++) {
            // Just use the cached values
            const min = chartMin;
            const max = chartMax;
        }
        console.timeEnd('New chart method - cached');
        
        // Test 3: getImageData calls
        const testCanvas = document.createElement('canvas');
        testCanvas.width = 128;
        testCanvas.height = 128;
        const testCtx = testCanvas.getContext('2d', { willReadFrequently: true });
        testCtx.fillStyle = 'green';
        testCtx.fillRect(0, 0, 128, 128);
        
        // Old method (40 single-pixel getImageData calls)
        console.time('Old smartInit - 40 getImageData calls');
        for (let iter = 0; iter < 100; iter++) {
            for (let i = 0; i < 40; i++) {
                const tx = Math.floor(Math.random() * 128);
                const ty = Math.floor(Math.random() * 128);
                const data = testCtx.getImageData(tx, ty, 1, 1).data;
            }
        }
        console.timeEnd('Old smartInit - 40 getImageData calls');
        
        // New method (1 full getImageData, then indexed access)
        console.time('New smartInit - 1 getImageData + indexing');
        for (let iter = 0; iter < 100; iter++) {
            const fullData = testCtx.getImageData(0, 0, 128, 128).data;
            for (let i = 0; i < 40; i++) {
                const tx = Math.floor(Math.random() * 128);
                const ty = Math.floor(Math.random() * 128);
                const idx = (ty * 128 + tx) * 4;
                const r = fullData[idx];
                const g = fullData[idx + 1];
                const b = fullData[idx + 2];
            }
        }
        console.timeEnd('New smartInit - 1 getImageData + indexing');
        
        console.log('All performance tests completed!');
    </script>
</body>
</html>
